packages:
  - .

patchedDependencies:
  wouter@3.7.1: patches/wouter@3.7.1.patch

overrides:
  tailwindcss>nanoid: 3.3.7

# esbuild's own postinstall only validates/chmods its cached native binary;
# on Hostinger's build sandbox that spawn fails with EACCES (permission
# issue in their build container, not a broken binary). The actual binary
# ships via the @esbuild/<platform> optional dependency, which installs as
# a normal package file (not a script) and is unaffected by declining here.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: false
  protobufjs: set this to true or false
  puppeteer: true
